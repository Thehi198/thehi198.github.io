# Site identity. Everything in the home page header comes from here.
title: Aaditya Rao
description: Electrical and computer engineering student at Olin College working on Hall thruster design.
url: "https://thehi198.github.io"
baseurl: ""
lang: en

author:
  name: Aaditya Rao
  affiliation: Electrical and computer engineering, Olin College of Engineering.
  photo: /assets/images/bio-photo.png
  photo_alt: Portrait of Aaditya Rao
  links:
    - label: Email
      href: mailto:arao@olin.edu
    - label: GitHub
      href: https://github.com/thehi198
    - label: LinkedIn
      href: https://linkedin.com/in/aadrao

# Home page
home:
  projects_heading: Portfolio
  blog_heading: Writing
  blog_limit: 6

# Build
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
  math_engine: mathjax
  syntax_highlighter_opts:
    disable: true

permalink: /blog/:year/:title/

collections:
  projects:
    output: true
    permalink: /projects/:name/

defaults:
  - scope: { path: "", type: projects }
    values: { layout: project }
  - scope: { path: "", type: posts }
    values: { layout: post }

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

feed:
  path: blog/feed.xml

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
  - design-system/README.md
  - design-system/CLAUDE.md
  - design-system/tokens.json
  - design-system/components/bundle.js
  - design-system/components/index.d.ts
  - design-system/components/Equation.md
  - design-system/components/Figure.md
  - design-system/components/PageHeader.md
  - design-system/components/ProjectEntry.md
  - design-system/components/Remark.md
  - design-system/components/SectionHeading.md
  - design-system/components/SpecTable.md
  - design-system/components/Tag.md
