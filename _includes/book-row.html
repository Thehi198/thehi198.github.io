{%- assign b = include.book -%}
<li class="book"><span class="book-main">{% if b.link %}<a class="book-title" href="{{ b.link }}">{{ b.title }}</a>{% else %}<cite class="book-title">{{ b.title }}</cite>{% endif %}<span class="book-author">{{ b.author }}</span></span>{% if b.finished %}<span class="book-when">{{ b.finished | append: "-01" | slice: 0, 10 | date: "%b %Y" }}</span>{% endif %}</li>
