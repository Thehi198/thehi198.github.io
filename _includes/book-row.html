{%- assign b = include.book -%}
<li class="book"><span class="book-main">{% if b.link %}<a class="book-title" href="{{ b.link }}">{{ b.title }}</a>{% else %}<cite class="book-title">{{ b.title }}</cite>{% endif %}<span class="book-author">{{ b.author }}</span></span>{% if b.status == "reading" %}<span class="book-when">In progress</span>{% elsif include.year and b.read %}<span class="book-when">{{ b.read }}</span>{% endif %}</li>
