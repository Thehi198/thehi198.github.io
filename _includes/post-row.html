{%- assign post = include.post -%}
<article class="post-row">
  <time class="post-row-date" datetime="{{ post.date | date_to_xmlschema }}">{{ post.date | date: "%d %b %Y" }}</time>
  <div>
    <h3 class="post-row-title"><a href="{{ post.url | relative_url }}">{{ post.title }}</a></h3>
    {% assign summary = post.description | default: post.excerpt | strip_html | strip %}
    {% if summary != "" %}<p class="post-row-abs">{{ summary | truncatewords: 40 }}</p>{% endif %}
  </div>
</article>
