---
layout: default
---
<article class="doc">
  <p class="back"><a class="mg-link" href="{{ '/' | relative_url }}#writing">← {{ site.author.name }}</a></p>
  <header class="doc-header">
    <h1 class="title doc-title">{{ page.title }}</h1>
    <div class="mg-entry-meta"><time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%d %b %Y" }}</time>{% if page.tags.size > 0 %} · {{ page.tags | join: " · " }}{% endif %}</div>
  </header>
  <div class="prose">
    {{ content }}
  </div>
  <p class="back back-end"><a class="mg-link" href="{{ '/' | relative_url }}#writing">← All writing</a></p>
</article>
